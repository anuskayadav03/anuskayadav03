<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff4fa3"/><stop offset=".55" stop-color="#d24cff"/><stop offset="1" stop-color="#7f5cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.m{font-family:ui-monospace,monospace}
.row{opacity:0;animation:slide .6s ease forwards}.row:nth-of-type(1){animation-delay:.2s}.row:nth-of-type(2){animation-delay:.45s}.row:nth-of-type(3){animation-delay:.7s}.row:nth-of-type(4){animation-delay:.95s}
@keyframes slide{from{opacity:0;transform:translateX(-35px)}to{opacity:1;transform:translateX(0)}} 
.ring{animation:pulse 2.6s ease-in-out infinite;transform-origin:125px 130px}@keyframes pulse{50%{filter:url(#glow);transform:scale(1.035)}}
</style></defs>
<rect x="3" y="3" width="634" height="254" rx="24" fill="#16051d" stroke="#6c356e"/>
<circle class="ring" cx="125" cy="130" r="86" fill="none" stroke="#44254d" stroke-width="14"/>
<circle class="ring" cx="125" cy="130" r="86" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="390 151" transform="rotate(-90 125 130)"/>
<text class="m" x="125" y="122" text-anchor="middle" fill="#ff4fa3" font-size="34">10</text><text class="m" x="125" y="145" text-anchor="middle" fill="#d8bfdc" font-size="12">PUBLIC REPOS</text>
<text class="m" x="255" y="48" fill="#cdb4d0" font-size="12" letter-spacing="2">DEV PROFILE / LOCAL STATS</text>
<g class="row s" fill="#fff"><text x="255" y="88" font-size="18">01 <tspan fill="#ff4fa3">WEB</tspan></text><text x="400" y="88" font-size="13" fill="#cdb4d0">building &amp; practice</text></g>
<g class="row s" fill="#fff"><text x="255" y="124" font-size="18">02 <tspan fill="#d24cff">JAVA</tspan></text><text x="400" y="124" font-size="13" fill="#cdb4d0">DSA + collections</text></g>
<g class="row s" fill="#fff"><text x="255" y="160" font-size="18">03 <tspan fill="#9c72ff">FULL STACK</tspan></text><text x="400" y="160" font-size="13" fill="#cdb4d0">frontend → backend</text></g>
<g class="row s" fill="#fff"><text x="255" y="196" font-size="18">04 <tspan fill="#ff79b9">GROWTH</tspan></text><text x="400" y="196" font-size="13" fill="#cdb4d0">learning by shipping</text></g>
<text class="m" x="255" y="231" fill="#7f5cff" font-size="11">RANK RING • PERSONAL PROGRESS • NOT A GITHUB RANK</text>
</svg>
